[bgm_bridge]
enabled=1
profile=sinobuz24
fallback_profile=sinobuz24_compat
weekday=auto
; 0 selects the complete-mix fallback with original host scheduling.
smooth_transition=1
; Fade time now belongs to each profile's playback section.
; For Sparkle Shower audio: set profile=sparkle33 and fallback_profile=sparkle33.
; IIDX 20-23: profile=<id>, fallback_profile=<id>_compat.
; IIDX 18/19: use resort18/lincle19 for both fields; keep smooth_transition=1.
